name: mini-deep-research

# 仅用于本机开发。固定镜像摘要；生产环境另行设置账号、网络与备份。
services:
  postgres:
    image: postgres:16@sha256:bffa6baeb307a531d731bf3ef9835dc396afaeddf81944337b8f990b2109ffca
    environment:
      POSTGRES_USER: deep_research
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: deep_research
      TZ: UTC
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deep_research -d deep_research"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
